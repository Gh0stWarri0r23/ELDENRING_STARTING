<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elden Ring - Stream Starting Soon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=IM+Fell+English+SC&family=Cinzel+Decorative:wght@700&display=swap');

    :root {
      --gold-primary: #f3e5ab;
      --gold-dark: #c5a059;
      --gold-glow: rgba(243, 229, 171, 0.4);
      --obsidian-bg: #030508;
      --card-bg: rgba(10, 14, 20, 0.92);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--obsidian-bg);
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
    }

    /* Cinematic Erdtree Ambient Glow */
    .erdtree-vignette {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 30%, rgba(243, 229, 171, 0.12) 0%, rgba(197, 160, 89, 0.05) 45%, transparent 75%),
        radial-gradient(circle at 50% 100%, rgba(20, 15, 10, 0.95) 0%, rgba(3, 5, 8, 1) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Light Rays Effect */
    .god-rays {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 200%;
      height: 140%;
      background: radial-gradient(ellipse at top, rgba(243, 229, 171, 0.08) 0%, transparent 60%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 2;
      animation: rayPulse 8s ease-in-out infinite alternate;
    }

    /* High-Fidelity Medieval Border & Frame */
    .elden-frame {
      position: relative;
      background: linear-gradient(145deg, rgba(14, 18, 24, 0.94) 0%, rgba(6, 9, 14, 0.98) 100%);
      border: 1px solid rgba(197, 160, 89, 0.5);
      box-shadow: 
        0 0 50px rgba(0, 0, 0, 0.95),
        0 0 30px rgba(197, 160, 89, 0.2),
        inset 0 0 45px rgba(197, 160, 89, 0.08);
      backdrop-filter: blur(8px);
    }

    /* Ornate Filigree Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 32px;
      height: 32px;
      pointer-events: none;
    }
    .corner-tl { top: -2px; left: -2px; border-top: 3px solid #f3e5ab; border-left: 3px solid #f3e5ab; }
    .corner-tr { top: -2px; right: -2px; border-top: 3px solid #f3e5ab; border-right: 3px solid #f3e5ab; }
    .corner-bl { bottom: -2px; left: -2px; border-bottom: 3px solid #f3e5ab; border-left: 3px solid #f3e5ab; }
    .corner-br { bottom: -2px; right: -2px; border-bottom: 3px solid #f3e5ab; border-right: 3px solid #f3e5ab; }

    /* Text Glows and Typography Styling */
    .title-cinematic {
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      letter-spacing: 0.18em;
      text-shadow: 
        0 0 25px rgba(243, 229, 171, 0.5),
        0 0 50px rgba(197, 160, 89, 0.3),
        0 4px 15px rgba(0, 0, 0, 0.9);
    }

    .subtitle-latin {
      font-family: 'IM Fell English SC', serif;
      letter-spacing: 0.35em;
      color: #c5a059;
      text-shadow: 0 0 12px rgba(197, 160, 89, 0.6);
    }

    /* Grace Emblem Pulse */
    .grace-emblem {
      position: relative;
      width: 24px;
      height: 24px;
      background: #f3e5ab;
      transform: rotate(45deg);
      box-shadow: 
        0 0 15px #f3e5ab,
        0 0 35px #c5a059,
        0 0 60px rgba(243, 229, 171, 0.8);
      animation: gracePulse 2.8s ease-in-out infinite alternate;
    }

    /* Shimmering Progress Bar */
    .progress-track {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(197, 160, 89, 0.4);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .progress-fill {
      background: linear-gradient(90deg, #8a6f37 0%, #c5a059 40%, #f3e5ab 70%, #c5a059 100%);
      background-size: 200% 100%;
      box-shadow: 0 0 15px rgba(243, 229, 171, 0.6);
      animation: shimmerBar 3.5s linear infinite;
    }

    /* Keyframe Animations */
    @keyframes gracePulse {
      0% { transform: rotate(45deg) scale(0.9); opacity: 0.7; }
      100% { transform: rotate(45deg) scale(1.15); opacity: 1; filter: drop-shadow(0 0 10px #f3e5ab); }
    }

    @keyframes rayPulse {
      0% { opacity: 0.5; transform: translateX(-50%) scaleY(0.95); }
      100% { opacity: 1; transform: translateX(-50%) scaleY(1.05); }
    }

    @keyframes shimmerBar {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Control Panel Toggle (Hidden during clean broadcast) */
    .hud-controls {
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body class="flex items-center justify-center relative">

  <!-- Background Canvas for Grace Embers -->
  <canvas id="emberCanvas" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></canvas>

  <!-- Erdtree Background Graphic Silhouette & Rays -->
  <div class="erdtree-vignette"></div>
  <div class="god-rays"></div>

  <!-- Background SVG Silhouette of the Golden Erdtree -->
  <svg class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[900px] h-[700px] opacity-15 pointer-events-none z-1" viewBox="0 0 500 600" fill="none">
    <path d="M250 600 C240 450 210 350 180 280 C150 210 100 150 50 100 M250 600 C260 450 290 350 320 280 C350 210 400 150 450 100 M250 600 L250 150 M250 300 C200 240 120 200 70 180 M250 250 C300 190 380 150 430 130 M250 180 C210 130 150 90 100 70 M250 160 C290 110 350 70 400 50" stroke="#f3e5ab" stroke-width="3" stroke-linecap="round"/>
    <circle cx="250" cy="120" r="140" fill="url(#erdtreeGlow)" opacity="0.4"/>
    <defs>
      <radialGradient id="erdtreeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f3e5ab" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- Main Center Display Screen -->
  <main class="relative z-10 flex flex-col items-center justify-center p-6 w-full max-w-4xl">
    
    <div class="elden-frame w-full rounded-sm p-10 md:p-14 flex flex-col items-center text-center relative">
      
      <!-- Filigree Corners -->
      <div class="corner-bracket corner-tl"></div>
      <div class="corner-bracket corner-tr"></div>
      <div class="corner-bracket corner-bl"></div>
      <div class="corner-bracket corner-br"></div>

      <!-- Top Emblem & Realm Badge -->
      <div class="flex items-center gap-4 mb-4">
        <div class="h-[1px] w-12 md:w-24 bg-gradient-to-r from-transparent to-[#c5a059]"></div>
        <div class="subtitle-latin text-xs md:text-sm tracking-widest uppercase">
          [ THE LANDS BETWEEN ]
        </div>
        <div class="h-[1px] w-12 md:w-24 bg-gradient-to-l from-transparent to-[#c5a059]"></div>
      </div>

      <!-- Main Headline -->
      <h1 id="mainTitle" class="title-cinematic text-3xl md:text-5xl lg:text-6xl font-black my-3 leading-tight text-[#f3e5ab]">
        STREAM STARTING SOON
      </h1>

      <!-- Subtitle Lore Banner -->
      <div class="flex items-center justify-center gap-3 my-4 w-full max-w-md">
        <div class="h-[1px] grow bg-gradient-to-r from-transparent via-[#c5a059] to-transparent"></div>
        <span id="subTitle" class="text-xs md:text-sm tracking-[0.25em] text-[#c5a059] uppercase font-semibold">
          PREPARE YOURSELF, TARNISHED
        </span>
        <div class="h-[1px] grow bg-gradient-to-r from-transparent via-[#c5a059] to-transparent"></div>
      </div>

      <!-- Live Countdown Display -->
      <div class="my-6">
        <div id="countdown" class="font-mono text-5xl md:text-7xl font-bold tracking-wider text-[#f3e5ab] drop-shadow-[0_0_25px_rgba(243,229,171,0.4)]">
          05:00
        </div>
      </div>

      <!-- Site of Grace Loading Meter -->
      <div class="w-full max-w-lg mt-2 flex flex-col gap-2">
        <div class="progress-track w-full h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="progress-fill h-full w-0 transition-all duration-300"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] font-mono tracking-widest text-[#94a3b8] mt-1 px-1">
          <span class="text-[#c5a059]">GUIDANCE OF GRACE</span>
          <span id="statusPercent" class="text-[#f3e5ab]">CHARGING 0%</span>
        </div>
      </div>

    </div>

    <!-- Bottom Status Indicator with Grace Icon -->
    <div class="mt-8 flex items-center gap-3 text-xs md:text-sm tracking-[0.3em] text-[#c5a059] font-medium drop-shadow-md">
      <div class="grace-emblem"></div>
      <span>RESTING AT SITE OF GRACE...</span>
    </div>

  </main>

  <!-- Streamer Control Bar (Hover to reveal at bottom left) -->
  <div class="hud-controls fixed bottom-4 left-4 z-50 bg-slate-950/90 border border-[#c5a059]/40 rounded p-3 opacity-20 hover:opacity-100 backdrop-blur-md flex items-center gap-2 text-xs">
    <button id="btnToggle" class="px-3 py-1.5 bg-[#c5a059]/20 hover:bg-[#c5a059]/40 border border-[#c5a059] rounded text-[#f3e5ab] font-bold transition">
      Pause / Start
    </button>
    <button id="btnAddMin" class="px-3 py-1.5 bg-[#c5a059]/20 hover:bg-[#c5a059]/40 border border-[#c5a059] rounded text-[#f3e5ab] font-bold transition">
      +5 Min
    </button>
    <button id="btnReset" class="px-3 py-1.5 bg-red-950/40 hover:bg-red-900/60 border border-red-500/50 rounded text-red-200 transition">
      Reset
    </button>
  </div>

  <!-- JavaScript Logic for Embers & Countdown Timer -->
  <script>
    // --- Canvas Grace Embers System ---
    (function initEmbers() {
      const canvas = document.getElementById('emberCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const particles = [];
      const particleCount = 110;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2.8 + 0.6,
          speedY: Math.random() * 0.7 + 0.25,
          speedX: (Math.random() - 0.5) * 0.45,
          opacity: Math.random() * 0.8 + 0.2,
          pulseSpeed: Math.random() * 0.02 + 0.005,
          color: Math.random() > 0.3 ? '#f3e5ab' : '#c5a059'
        });
      }

      function animateEmbers() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.y -= p.speedY;
          p.x += p.speedX;
          p.opacity += Math.sin(Date.now() * p.pulseSpeed) * 0.01;

          // Wrap around screen boundaries
          if (p.y < -10) {
            p.y = canvas.height + 10;
            p.x = Math.random() * canvas.width;
          }
          if (p.x < -10) p.x = canvas.width + 10;
          if (p.x > canvas.width + 10) p.x = -10;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0.1, Math.min(1, p.opacity));
          ctx.shadowBlur = p.size * 4;
          ctx.shadowColor = p.color;
          ctx.fill();
        });

        requestAnimationFrame(animateEmbers);
      }

      animateEmbers();
    })();

    // --- Countdown Timer Logic ---
    let totalSeconds = 300; // 5 Minutes default
    let initialSeconds = 300;
    let timerInterval = null;
    let isRunning = true;

    const displayCountdown = document.getElementById('countdown');
    const progressBar = document.getElementById('progressBar');
    const statusPercent = document.getElementById('statusPercent');

    function updateDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      displayCountdown.textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      // Progress calculation
      const elapsed = initialSeconds - totalSeconds;
      const pct = Math.min(100, Math.max(0, Math.floor((elapsed / initialSeconds) * 100)));
      progressBar.style.width = `${pct}%`;
      statusPercent.textContent = `CHARGING ${pct}%`;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          displayCountdown.textContent = "00:00";
          document.getElementById('subTitle').textContent = "THE TARNISHED HAS AWAKENED";
        }
      }, 1000);
      isRunning = true;
    }

    // Controls Event Listeners
    document.getElementById('btnToggle').addEventListener('click', () => {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
      } else {
        startTimer();
      }
    });

    document.getElementById('btnAddMin').addEventListener('click', () => {
      totalSeconds += 300;
      initialSeconds += 300;
      updateDisplay();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      totalSeconds = 300;
      initialSeconds = 300;
      updateDisplay();
      if (!isRunning) startTimer();
    });

    // Start on initialization
    updateDisplay();
    startTimer();
  </script>
</body>
</html>
